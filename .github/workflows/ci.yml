name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore GameAmbient.sln
      - run: dotnet build GameAmbient.sln -c Release --no-restore
      - run: dotnet test GameAmbient.sln -c Release --no-build
      - name: Publish portable Windows app
        run: dotnet publish src/GameAmbient.Windows/GameAmbient.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/game-ambient-win-x64
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: GameAmbient-win-x64
          path: artifacts/game-ambient-win-x64
          if-no-files-found: error
          retention-days: 14
